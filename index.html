<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobin | Socials</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
  
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:#080808;
color:white;
font-family:Arial,sans-serif;
}

.card{
width:90%;
max-width:390px;
padding:42px 24px;
text-align:center;
background:linear-gradient(145deg,#151515,#0d0d0d);
border:1px solid #252525;
border-radius:28px;
box-shadow:0 20px 70px rgba(0,0,0,.55);
}

.avatar{
width:86px;
height:86px;
border-radius:50%;
margin:0 auto 18px;
background:linear-gradient(135deg,#333,#111);
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
font-weight:bold;
border:1px solid #333;
}

h1{
margin:0;
font-size:28px;
letter-spacing:3px;
}

p{
color:#888;
margin:8px 0 30px;
}

a{
display:flex;
align-items:center;
justify-content:center;
gap:10px;
text-decoration:none;
color:white;
background:#1a1a1a;
border:1px solid #2c2c2c;
padding:16px;
border-radius:15px;
margin:12px 0;
font-size:16px;
font-weight:bold;
}

.icon{
font-size:20px;
}

footer{
margin-top:25px;
color:#555;
font-size:12px;
}
</style>
</head>

<body>

<main class="card">

<div class="avatar">M</div>

<h1>Me</h1>

<p>My Socials</p>

<a href="https://instagram.com/_them0bin" target="_blank">
<span class="icon">📸</span>
Instagram
</a>

<a href="https://t.me/toX64ji" target="_blank">
<span class="icon">✈️</span>
Telegram
</a>

<footer>© 2026 Mobin</footer>

</main>

</body>
</html>
